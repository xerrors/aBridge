name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_macos:
        description: Build the optimized macOS App and run all native desktop tests
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22.13.0" }
          - { os: ubuntu-latest, node: "24" }
          - { os: ubuntu-latest, node: "26" }
          - { os: macos-latest, node: "22" }
          - { os: macos-15, node: "22" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-audit --no-fund
        if: runner.os == 'Linux' || inputs.full_macos
      - name: Shared checks and minimum Node compatibility
        if: runner.os == 'Linux' && matrix.node == '22.13.0'
        run: npm run check
      - name: Test Node compatibility
        if: runner.os == 'Linux' && matrix.node != '22.13.0'
        run: npm test
      - name: Compile Swift desktop targets
        if: runner.os == 'macOS' && !inputs.full_macos
        run: npm run desktop:compile-check
      - name: Build and test native desktop
        if: runner.os == 'macOS' && inputs.full_macos
        run: npm run test:desktop
      - name: Retain local package candidates
        if: runner.os == 'Linux' && matrix.node == '22.13.0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-candidates
          path: |
            dist/releases/*.tgz
            dist/releases/*.zip
          if-no-files-found: error
          retention-days: 7
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run commitlint -- --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  windows:
    name: Windows client
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: powershell -NoProfile -File tools/ci-windows.ps1 -Task check
      - name: Diagnose Windows command startup on failure
        if: failure()
        run: powershell -NoProfile -File tools/ci-windows.ps1 -Task diagnose
      - run: powershell -NoProfile -File tools/ci-windows.ps1 -Task windows:shell:check
      - run: powershell -NoProfile -File tools/ci-windows.ps1 -Task package:windows
      - run: powershell -NoProfile -File tools/ci-windows.ps1 -Task package:windows:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-client-unsigned
          path: |
            dist/releases/*windows-x64-unsigned.zip
            dist/releases/*windows-x64-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 30
