plugins {
    id 'com.android.application' version '9.2.1'
}

def contractFile = file('../../dist/desktop/desktop-contract.json')
def contract = new groovy.json.JsonSlurper().parse(contractFile)
def upstreamVersion = contract.version
def versionParts = upstreamVersion.tokenize('.').collect { it.toInteger() }

android {
    namespace 'dev.abridge.android'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.abridge.android'
        minSdk 30
        targetSdk 36
        versionCode versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]
        versionName upstreamVersion
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes.configureEach {
        minifyEnabled = true
        shrinkResources = true
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    packaging {
        // Compress DEX in standalone APKs to reduce the download size.
        dex.useLegacyPackaging = true
        // No Kotlin reflection or coroutine debug agents are used in the app.
        resources.excludes += ['**/*.kotlin_builtins', 'DebugProbesKt.bin']
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/contract').get().asFile)
    sourceSets.main.assets.srcDir('ui/dist')
}

// Android validates only its own tools plus operation and welcome frames.
def withoutSchemaAnnotations(value) {
    if (value instanceof Map) {
        return value.findAll { key, item ->
            !(key in ['$schema', 'description', 'default'] && !(item instanceof Map))
        }.collectEntries { key, item -> [key, withoutSchemaAnnotations(item)] }
    }
    if (value instanceof List) return value.collect { withoutSchemaAnnotations(it) }
    return value
}
def syncContract = tasks.register('syncDeviceContract') {
    inputs.file(contractFile)
    def output = layout.buildDirectory.file('generated/contract/desktop-contract.json')
    outputs.file(output)
    doLast {
        def tools = contract.androidTools as Set
        def schemaNames = tools + ['operation', 'welcome']
        def androidContract = [
            version: contract.version,
            protocol: contract.protocol,
            limits: contract.limits,
            androidTools: contract.androidTools,
            toolCapabilities: contract.toolCapabilities.findAll { name, capability -> name in tools },
            schemas: withoutSchemaAnnotations(contract.schemas.findAll { name, schema -> name in schemaNames })
        ]
        def target = output.get().asFile
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.toJson(androidContract)
    }
}
def buildUi = tasks.register('buildAndroidUi', Exec) {
    inputs.files(fileTree('ui') {
        include 'src/**', 'public/**', 'index.html', 'package*.json', 'vite.config.ts', 'tsconfig.json'
    })
    outputs.dir('ui/dist')
    commandLine 'npm', '--prefix', 'ui', 'run', 'build'
}
tasks.named('preBuild') { dependsOn syncContract, buildUi }

dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
