plugins {
    id 'com.android.application' version '9.2.1'
}

def upstream = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def parts = upstream.tokenize('.').take(3).collect { it.replaceAll(/[^0-9].*$/, '').toInteger() }
android {
    namespace 'com.aihome.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.aihome.app'
        minSdk 30
        targetSdk 36
        versionName upstream
        versionCode parts[0] * 1000000 + parts[1] * 1000 + parts[2]
    }
    packaging {
        // Compress DEX in the download; Android extracts it during installation.
        dex.useLegacyPackaging = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
}
