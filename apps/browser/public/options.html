<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>aBridge · 浏览器设置</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="settings-shell">
      <header class="settings-header">
        <div class="brand">
          <img class="brand-symbol" src="icons/brand.svg" alt="" />
          <div>
            <img class="brand-wordmark" src="icons/wordmark.svg" alt="aBridge" /><span class="brand-caption"
              >for Browser</span
            >
          </div>
        </div>
      </header>
      <section class="page-heading"><h1>浏览器设置</h1></section>
      <section id="connection" class="connection-card loading" aria-live="polite">
        <div>
          <div class="status-chip">
            <span class="status-dot"></span><span id="status-title">正在检查</span>
          </div>
          <h2 id="device-name">当前浏览器</h2>
          <p id="error" class="error-message" role="alert" hidden></p>
        </div>
        <div id="controls" class="connection-actions" hidden>
          <button id="pause" class="primary" type="button">暂停访问</button
          ><button id="stop" class="secondary" type="button">停止任务</button>
        </div>
      </section>
      <section id="registered-info" class="settings-section" hidden>
        <div class="section-heading"><h2>设备信息</h2></div>
        <dl class="device-information">
          <div>
            <dt>浏览器名称</dt>
            <dd id="saved-label"></dd>
          </div>
          <div>
            <dt>Server 地址</dt>
            <dd id="saved-server"></dd>
          </div>
          <div>
            <dt>设备 ID</dt>
            <dd id="saved-device"></dd>
          </div>
        </dl>
      </section>
      <section id="registration-section" class="settings-section">
        <div class="section-heading"><h2>连接当前浏览器</h2></div>
        <form id="register">
          <div class="field-grid">
            <label class="wide"
              >Server 地址<input
                id="server"
                type="url"
                required
                placeholder="https://abridge.example.com"
                autocomplete="url" /></label
            ><label>账户<input id="username" required autocomplete="username" placeholder="管理账户" /></label
            ><label
              >密码<input
                id="password"
                type="password"
                required
                autocomplete="current-password"
                placeholder="管理账户密码" /></label
            ><label class="wide"
              >浏览器名称<input id="label" maxlength="80" required placeholder="例如：Chrome · 工作账号"
            /></label>
          </div>
          <div class="form-footer"><button id="submit" class="primary" type="submit">授权并连接</button></div>
        </form>
      </section>
      <section class="settings-section diagnostic-section">
        <details id="diagnostics">
          <summary>连接诊断</summary>
          <dl id="connection-details" class="diagnostic-list"></dl>
        </details>
        <button id="refresh-status" class="text-button" type="button">刷新状态</button>
      </section>
      <section id="unbind-section" class="settings-section unbind-section" hidden>
        <div><h2>设备授权</h2></div>
        <button id="unbind" class="danger-button" type="button">解除绑定</button>
      </section>
    </main>
    <script src="options.js" type="module"></script>
  </body>
</html>
