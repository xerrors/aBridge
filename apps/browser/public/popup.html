<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>aBridge for Browser</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand">
          <img class="brand-symbol" src="icons/brand.svg" alt="" />
          <img class="brand-wordmark" src="icons/wordmark.svg" alt="aBridge" />
        </div>
        <p id="connection" class="status-chip" role="status">
          <span class="status-dot" aria-hidden="true"></span><span id="status-label">读取中…</span>
        </p>
      </header>
      <h1 id="device-name">当前浏览器</h1>
      <p id="error" class="error-message" role="alert" hidden></p>
      <div class="popup-actions">
        <button id="pause" class="primary" type="button" hidden>暂停访问</button>
        <button id="open-connection" class="secondary" type="button" hidden>管理连接</button>
        <button id="stop" class="secondary" type="button" hidden>停止任务</button>
        <button id="retry" class="secondary" type="button" hidden>重试读取状态</button>
      </div>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
