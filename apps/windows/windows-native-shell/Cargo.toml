[package]
name = "abridge-windows-shell"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
build = "build.rs"

[[bin]]
name = "aBridge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
regex = "1"
base64 = "0.22"
getrandom = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "fs"] }
tokio-tungstenite = { version = "0.28", features = ["connect", "native-tls"] }
futures-util = { version = "0.3", features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
ryu-js = "1"
sha2 = "0.10"
url = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[build-dependencies]
serde_json = "1"
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
